[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "malabardb"
version = "0.1.0"
description = "Ingredient embeddings and nutrition estimation for Kerala cuisine"
requires-python = ">=3.10,<3.14"
dynamic = ["dependencies"]

# Dependencies are read FROM requirements.txt rather than duplicated here.
# Two lists would drift; requirements.txt stays the single source of truth and
# keeps its version-rationale comments (setuptools ignores '#' lines).
[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

# BUG FIX FOR GENSIM ERROR:
# run 'pip install -e ".[embeddings,viz]"' for specific dependencies 
[project.optional-dependencies]
embeddings = ["gensim>=4.4,<5.0", "scipy>=1.10"]
viz = ["scikit-learn>=1.3", "matplotlib>=3.7"]

# src/ layout: the importable package is `malabardb`, and src/ is only the
# directory placed on sys.path. This is why there is no src/__init__.py.
[tool.setuptools.packages.find]
where = ["src"]